# /etc/nginx/sites-available/pumpfun-mcp
# Replace pump.example.com with your subdomain, then run certbot --nginx.
server {
    listen 80;
    server_name pump.example.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streamable HTTP may answer with SSE — don't buffer it
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1m;
    }

    # keep the secret path out of access logs
    access_log off;
}
